<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit 8 - Public Buildings</title>
    <style>
        /* GENEL VE MOBİL STİL AYARLARI */
        body {
            font-family: 'Segoe UI', 'Arial', sans-serif; 
            background: linear-gradient(135deg, #a8dadc 0%, #457b9d 100%); 
            margin: 0;
            padding: 15px 0;
            display: flex;
            flex-direction: column; 
            align-items: center;
            overflow-x: hidden; 
            min-height: 100vh;
        }
        
        .signature-container {
            text-align: center;
            margin-bottom: 20px;
        }

        .top-signature {
            font-family: 'Impact', 'Franklin Gothic Bold', sans-serif; 
            font-size: 3.5rem; 
            color: #ffbe0b; 
            text-shadow: -3px -3px 0 #e63946, 3px -3px 0 #e63946, -3px 3px 0 #e63946, 3px 3px 0 #e63946, 5px 5px 0 #1d3557; 
            letter-spacing: 3px; 
            animation: bounce 2s infinite; 
            padding: 10px 20px; 
            background: linear-gradient(45deg, #f1faee, #a8dadc); 
            border-radius: 15px; 
            box-shadow: 0 8px 15px rgba(0,0,0,0.3); 
            display: inline-block;
        }

        .phone-number {
            display: block;
            font-size: 1.5rem;
            color: #1d3557;
            background-color: #ffffff;
            padding: 8px 25px;
            border-radius: 50px;
            margin-top: 10px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            border: 3px solid #ffbe0b;
            text-decoration: none;
        }

        .phone-icon {
            color: #007bff; 
            margin-right: 8px;
            font-style: normal;
        }

        #quiz-container {
            width: 95%;
            max-width: 650px;
            background-color: #ffffff;
            padding: 20px 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3); 
            border-radius: 25px; 
            border: 6px solid #ffbe0b; 
            animation: fadeIn 1s ease-out; 
            position: relative; 
        }

        h1 {
            color: #e63946; 
            text-align: center;
            margin-bottom: 25px;
            font-size: 1.8rem; 
            border-bottom: 4px dotted #a8dadc; 
            padding-bottom: 15px;
        }

        .question {
            margin-bottom: 30px;
            padding: 15px;
            border-bottom: 2px dashed #f1f1f1; 
            animation: slideInUp 0.5s ease-out forwards; 
            opacity: 0; 
            transform: translateY(20px); 
        }

        .question-text {
            font-size: 1.3rem; 
            color: #1d3557; 
            font-weight: bold;
            margin-bottom: 15px;
            background-color: #f1faee; 
            padding: 12px;
            border-radius: 10px;
            border-left: 6px solid #457b9d; 
        }

        .option-button {
            display: block;
            width: 100%;
            padding: 14px;
            margin-bottom: 12px;
            border: 2px solid #a8dadc; 
            border-radius: 18px; 
            background-color: #ffffff;
            cursor: pointer;
            transition: all 0.2s ease; 
            font-size: 1.1rem;
            text-align: left;
        }

        .option-button:hover:not(:disabled) {
            background-color: #f0f9fa; 
            transform: scale(1.02);
        }

        .option-button.correct {
            background-color: #d4edda; 
            border-color: #28a745;    
            color: #155724;
            font-weight: bold;
        }

        .option-button.incorrect {
            background-color: #f8d7da; 
            border-color: #dc3545;    
            color: #721c24;
            font-weight: bold;
        }

        .result-button {
            width: 100%;
            padding: 18px;
            background-color: #e63946; 
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-size: 1.4rem;
            font-weight: bold;
            margin-top: 25px;
        }

        #results {
            margin-top: 30px;
            padding: 25px;
            border: 4px solid #ffbe0b; 
            border-radius: 20px;
            text-align: center;
            background-color: #fffacd; 
            display: none;
        }

        @keyframes bounce { 0%, 20%, 50%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-15px); } 60% { transform: translateY(-8px); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="signature-container">
        <div class="top-signature">Esen Teacher</div>
        <a href="tel:05304773073" class="phone-number"><i class="phone-icon">📞</i>0530 477 30 73</a>
    </div>

    <div id="quiz-container">
        <h1>Unit 8 - Public Buildings<br><small style="font-size: 1.1rem; color: #457b9d;">(Kamu Binaları)</small></h1>
        <div id="questions-area"></div>
        <button class="result-button" onclick="showResults()">Testi Bitir ve Sonucu Gör</button>
        <div id="results"></div>
    </div>

    <script>
        const wordList = [
            { en: "amusement park", tr: "lunapark" },
            { en: "art gallery", tr: "resim galerisi" },
            { en: "bakery", tr: "fırın" },
            { en: "book store", tr: "kitapçı" },
            { en: "butcher", tr: "kasap" },
            { en: "chemist’s", tr: "eczane" },
            { en: "city hall", tr: "belediye binası" },
            { en: "coffee shop", tr: "kafeterya" },
            { en: "department store", tr: "çok katlı mağaza" },
            { en: "exhibition", tr: "sergi" },
            { en: "fire station", tr: "itfaiye" },
            { en: "game store", tr: "oyun mağazası" },
            { en: "gift shop", tr: "hediye mağazası" },
            { en: "governorship", tr: "kaymakamlık" },
            { en: "grocery", tr: "bakkal, market" },
            { en: "movie theatre", tr: "sinema" },
            { en: "municipal office", tr: "belediye ofisi" },
            { en: "municipality", tr: "belediye" },
            { en: "museum", tr: "müze" },
            { en: "music store", tr: "müzik mağazası" },
            { en: "pharmacy", tr: "eczane" },
            { en: "police officer", tr: "polis memuru" },
            { en: "police station", tr: "karakol" },
            { en: "post office", tr: "postane" },
            { en: "shopping mall", tr: "alışveriş merkezi" },
            { en: "tourist information office", tr: "turist bilgi ofisi" },
            { en: "arrive", tr: "varmak" },
            { en: "attend", tr: "gitmek" },
            { en: "borrow book", tr: "kitap ödünç almak" },
            { en: "build", tr: "inşa etmek" },
            { en: "buy", tr: "satın almak" },
            { en: "buy fruits and vegetables", tr: "meyve sebze satın almak" },
            { en: "chat", tr: "sohbet etmek" },
            { en: "destroy", tr: "yıkmak" },
            { en: "find", tr: "bulmak" },
            { en: "find medicine", tr: "ilaç bulmak" },
            { en: "give information", tr: "bilgi vermek" },
            { en: "go jogging", tr: "koşuya gitmek" },
            { en: "have fun", tr: "eğlenmek" },
            { en: "inform new address", tr: "yeni adresi bildirmek" },
            { en: "leave work", tr: "işten çıkmak" },
            { en: "make friends", tr: "yeni arkadaşlıklar edinmek" },
            { en: "meet friends", tr: "arkadaşlarla buluşmak" },
            { en: "report a crime", tr: "suç ihbar etme" },
            { en: "report burglary", tr: "soygunu ihbar etme" },
            { en: "ride roller coaster", tr: "hız trenine binmek" },
            { en: "see a movie", tr: "film izlemek" },
            { en: "see artwork", tr: "sanat eseri görmek" },
            { en: "see celebrity", tr: "ünlü görmek" },
            { en: "see new exhibition", tr: "yeni sergiyi görmek" },
            { en: "send parcel", tr: "kargo göndermek" },
            { en: "spend time", tr: "zaman harcamak" },
            { en: "stay", tr: "kalmak" },
            { en: "take … to", tr: "götürmek" },
            { en: "walk the dog", tr: "köpeği dışarı çıkarmak" }
        ];

        let score = 0;
        const answeredQuestions = {};

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function generateQuiz() {
            const quizArea = document.getElementById('questions-area');
            const uniqueTr = [...new Set(wordList.map(item => item.tr))];
            const shuffledWords = shuffleArray([...wordList]);
            
            let html = '';
            shuffledWords.forEach((word, index) => {
                const qId = `q${index}`;
                let distractors = uniqueTr.filter(t => t !== word.tr);
                shuffleArray(distractors);
                let options = shuffleArray([word.tr, ...distractors.slice(0, 3)]);
                
                html += `<div class="question" id="${qId}" style="animation-delay: ${index * 0.05}s;">
                            <p class="question-text">${index + 1}. ${word.en}</p>`;
                options.forEach(opt => {
                    html += `<button class="option-button" data-ans="${opt}" onclick="check('${qId}', '${opt.replace(/'/g, "\\'")}')">${opt}</button>`;
                });
                html += `</div>`;
            });
            quizArea.innerHTML = html;
        }

        function check(qId, selected) {
            if (answeredQuestions[qId]) return;
            const qEl = document.getElementById(qId);
            const btns = qEl.querySelectorAll('.option-button');
            const qTxt = qEl.querySelector('.question-text').textContent.split('. ')[1];
            const correct = wordList.find(w => w.en === qTxt).tr;

            btns.forEach(b => {
                b.disabled = true;
                if (b.dataset.ans === correct) b.classList.add('correct');
                if (b.dataset.ans === selected && selected !== correct) b.classList.add('incorrect');
            });
            if (selected === correct) score++;
            answeredQuestions[qId] = true;
        }

        function showResults() {
            const results = document.getElementById('results');
            results.innerHTML = `<h2>TEBRİKLER!</h2><p>Puanınız: ${score} / ${wordList.length}</p><p>Başarı Oranı: %${Math.round((score/wordList.length)*100)}</p>`;
            results.style.display = 'block';
            results.scrollIntoView({behavior: "smooth"});
        }

        document.addEventListener('DOMContentLoaded', generateQuiz);
    </script>
</body>
</html>
