<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme - 3 Kelime Testi</title>
    <style>
        /* GENEL VE MOBİL STİL AYARLARI */
        body {
            font-family: 'Segoe UI', 'Arial', sans-serif; 
            background: linear-gradient(135deg, #a8dadc 0%, #457b9d 100%); 
            margin: 0;
            padding: 15px 0;
            display: flex;
            flex-direction: column; 
            align-items: center;
            overflow-x: hidden; 
            min-height: 100vh;
        }
        
        .signature-container {
            text-align: center;
            margin-bottom: 20px;
        }

        .top-signature {
            font-family: 'Impact', 'Franklin Gothic Bold', sans-serif; 
            font-size: 3.5rem; 
            color: #ffbe0b; 
            text-shadow: -3px -3px 0 #e63946, 3px -3px 0 #e63946, -3px 3px 0 #e63946, 3px 3px 0 #e63946, 5px 5px 0 #1d3557; 
            letter-spacing: 3px; 
            animation: bounce 2s infinite; 
            padding: 10px 20px; 
            background: linear-gradient(45deg, #f1faee, #a8dadc); 
            border-radius: 15px; 
            box-shadow: 0 8px 15px rgba(0,0,0,0.3); 
            display: inline-block;
        }

        .phone-number {
            display: block;
            font-size: 1.5rem;
            color: #1d3557;
            background-color: #ffffff;
            padding: 8px 25px;
            border-radius: 50px;
            margin-top: 10px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            border: 3px solid #ffbe0b;
            text-decoration: none;
        }

        .phone-icon {
            color: #007bff; 
            margin-right: 8px;
            font-style: normal;
        }

        #quiz-container {
            width: 95%;
            max-width: 650px;
            background-color: #ffffff;
            padding: 20px 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3); 
            border-radius: 25px; 
            border: 6px solid #ffbe0b; 
            animation: fadeIn 1s ease-out; 
            position: relative; 
        }

        h1 {
            color: #e63946; 
            text-align: center;
            margin-bottom: 25px;
            font-size: 1.8rem; 
            border-bottom: 4px dotted #a8dadc; 
            padding-bottom: 15px;
        }

        .question {
            margin-bottom: 30px;
            padding: 15px;
            border-bottom: 2px dashed #f1f1f1; 
            animation: slideInUp 0.5s ease-out forwards; 
            opacity: 0; 
            transform: translateY(20px); 
        }

        .question-text {
            font-size: 1.3rem; 
            color: #1d3557; 
            font-weight: bold;
            margin-bottom: 15px;
            background-color: #f1faee; 
            padding: 12px;
            border-radius: 10px;
            border-left: 6px solid #457b9d; 
        }

        .option-button {
            display: block;
            width: 100%;
            padding: 14px;
            margin-bottom: 12px;
            border: 2px solid #a8dadc; 
            border-radius: 18px; 
            background-color: #ffffff;
            cursor: pointer;
            transition: all 0.2s ease; 
            font-size: 1.1rem;
            text-align: left;
        }

        .option-button:hover:not(:disabled) {
            background-color: #f0f9fa; 
            transform: scale(1.02);
        }

        .option-button.correct {
            background-color: #d4edda; 
            border-color: #28a745;    
            color: #155724;
            font-weight: bold;
        }

        .option-button.incorrect {
            background-color: #f8d7da; 
            border-color: #dc3545;    
            color: #721c24;
            font-weight: bold;
        }

        .result-button {
            width: 100%;
            padding: 18px;
            background-color: #e63946; 
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-size: 1.4rem;
            font-weight: bold;
            margin-top: 25px;
        }

        #results {
            margin-top: 30px;
            padding: 25px;
            border: 4px solid #ffbe0b; 
            border-radius: 20px;
            text-align: center;
            background-color: #fffacd; 
            display: none;
        }

        @keyframes bounce { 0%, 20%, 50%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-15px); } 60% { transform: translateY(-8px); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="signature-container">
        <div class="top-signature">Esen Teacher</div>
        <a href="tel:05304773073" class="phone-number"><i class="phone-icon">📞</i>0530 477 30 73</a>
    </div>

    <div id="quiz-container">
        <h1>Theme - 3<br><small style="font-size: 1.1rem; color: #457b9d;">Kelime Testi</small></h1>
        <div id="questions-area"></div>
        <button class="result-button" onclick="showResults()">Testi Bitir ve Sonucu Gör</button>
        <div id="results"></div>
    </div>

    <script>
        const wordList = [
            { "en": "addicted (adj)", "tr": "bağımlı" },
            { "en": "addiction (n)", "tr": "bağımlılık" },
            { "en": "adore (v)", "tr": "çok sevmek, tapmak" },
            { "en": "aggressive (adj)", "tr": "saldırgan, sinirli" },
            { "en": "aid (n/v)", "tr": "yardım, yardım etmek" },
            { "en": "alternatively (adv)", "tr": "alternatif olarak, bunun yerine" },
            { "en": "amazement (n)", "tr": "büyük şaşkınlık, hayret" },
            { "en": "amusement (n)", "tr": "eğlence, keyif" },
            { "en": "anger (n)", "tr": "öfke, kızgınlık" },
            { "en": "animated (adj)", "tr": "canlı, hareketli" },
            { "en": "animation (n)", "tr": "animasyon, çizim" },
            { "en": "anxiety (n)", "tr": "kaygı, endişe" },
            { "en": "anxious (adj)", "tr": "endişeli, kaygılı" },
            { "en": "appeal (v/n)", "tr": "ilgi çekmek, cazibe / başvurmak" },
            { "en": "assistance (n)", "tr": "yardım, destek" },
            { "en": "awareness (n)", "tr": "farkındalık, bilgi sahibi olma" },
            { "en": "bias (n)", "tr": "taraflılık, önyargı" },
            { "en": "biased (adj)", "tr": "taraflı, önyargılı" },
            { "en": "cast (n)", "tr": "oyuncu kadrosu" },
            { "en": "classic (n/adj)", "tr": "klasik, yüksek kaliteli eser" },
            { "en": "consult (v)", "tr": "danışmak" },
            { "en": "convenience (n)", "tr": "kolaylık, konfor" },
            { "en": "criterion (n)", "tr": "kriter, ölçüt" },
            { "en": "demonstrate (v)", "tr": "göstermek, kanıtlamak" },
            { "en": "dependent (adj)", "tr": "bağımlı, muhtaç" },
            { "en": "disconnection (n)", "tr": "bağlantının kopması, ayrılma" },
            { "en": "disorientation (n)", "tr": "yön/yer kaybı, kafa karışıklığı" },
            { "en": "dramatic (adj)", "tr": "heyecan verici, duygusal, dramatik" },
            { "en": "edit (v)", "tr": "düzenlemek (metin/film)" },
            { "en": "emotional (adj)", "tr": "duygusal" },
            { "en": "follower (n)", "tr": "takipçi" },
            { "en": "friend (v)", "tr": "arkadaş olarak eklemek" },
            { "en": "genre (n)", "tr": "tür (film, müzik vb.)" },
            { "en": "harm (n/v)", "tr": "zarar, zarar vermek" },
            { "en": "heal (v)", "tr": "iyileşmek, iyileştirmek" },
            { "en": "helpline (n)", "tr": "yardım hattı" },
            { "en": "inbox (n)", "tr": "gelen kutusu" },
            { "en": "increasingly (adv)", "tr": "giderek, artan bir şekilde" },
            { "en": "isolate (v)", "tr": "izole etmek, ayırmak" },
            { "en": "isolated (adj)", "tr": "yalıtılmış, tek kalmış, yalnız" },
            { "en": "majority (n)", "tr": "çoğunluk" },
            { "en": "masterpiece (n)", "tr": "başyapıt, şaheser" },
            { "en": "minority (n)", "tr": "azınlık" },
            { "en": "monitor (v/n)", "tr": "izlemek, kontrol etmek / ekran" },
            { "en": "necessity (n)", "tr": "gereksinim, ihtiyaç" },
            { "en": "overcome (v)", "tr": "üstesinden gelmek, yenmek" },
            { "en": "overuse (v/n)", "tr": "aşırı kullanmak / aşırı kullanım" },
            { "en": "panic (n/v)", "tr": "panik, paniklemek" },
            { "en": "password (n)", "tr": "şifre, parola" },
            { "en": "performing arts (n)", "tr": "gösteri sanatları (tiyatro, dans vb.)" },
            { "en": "podcasting (n)", "tr": "dijital ses yayını (podcast) yapma" },
            { "en": "preference (n)", "tr": "tercih" },
            { "en": "preserve (v)", "tr": "korumak, muhafaza etmek" },
            { "en": "preview (n/v)", "tr": "önizleme, önizlemek" },
            { "en": "privacy (n)", "tr": "gizlilik, özel hayat" },
            { "en": "production (n)", "tr": "yapım, üretim (film/oyun)" },
            { "en": "regulate (v)", "tr": "düzenlemek, kuralla kontrol etmek" },
            { "en": "rehearsal (n)", "tr": "prova" },
            { "en": "relief (n)", "tr": "rahatlama, ferahlama" },
            { "en": "remote learning (n)", "tr": "uzaktan eğitim" },
            { "en": "resist (v)", "tr": "karşı koymak, direnç göstermek" },
            { "en": "restrict (v)", "tr": "kısıtlamak, sınırlamak" },
            { "en": "scenario (n)", "tr": "senaryo, olası durum" },
            { "en": "sci-fi (n)", "tr": "bilimkurgu" },
            { "en": "screening (n)", "tr": "film gösterimi" },
            { "en": "securely (adv)", "tr": "güvenli bir şekilde" },
            { "en": "service provider (n)", "tr": "servis/hizmet sağlayıcı" },
            { "en": "severely (adv)", "tr": "ciddi şekilde, ağır bir biçimde" },
            { "en": "significant (adj)", "tr": "önemli, belirgin" },
            { "en": "sound effect (n)", "tr": "ses efekti" },
            { "en": "standard of living (n)", "tr": "yaşam standardı" },
            { "en": "stunt (n)", "tr": "tehlikeli sahnelerdeki aksiyon numarası" },
            { "en": "subtitle (n)", "tr": "altyazı" },
            { "en": "surfing (n)", "tr": "internette gezinme" },
            { "en": "tension (n)", "tr": "gerilim, gerginlik" },
            { "en": "tiredness (n)", "tr": "yorgunluk" },
            { "en": "trace (v)", "tr": "izini sürmek, kaynağını bulmak" },
            { "en": "unconscious (adj)", "tr": "bilinci kapalı, farkında olmayan" },
            { "en": "welfare (n)", "tr": "refah, sağlık ve güvenlik" },

            /* --- Eklenen Tamamlayıcı Kelimeler --- */
            { "en": "cyberbullying (n)", "tr": "siber zorbalık" },
            { "en": "digital footprint (n)", "tr": "dijital ayak izi" },
            { "en": "screen time (n)", "tr": "ekran süresi" },
            { "en": "audience (n)", "tr": "seyirci, izleyici kitlesi" },
            { "en": "entertainment (n)", "tr": "eğlence, gösteri" }
        ];

        let score = 0;
        const answeredQuestions = {};

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function generateQuiz() {
            const quizArea = document.getElementById('questions-area');
            const uniqueTr = [...new Set(wordList.map(item => item.tr))];
            const shuffledWords = shuffleArray([...wordList]);
            
            let html = '';
            shuffledWords.forEach((word, index) => {
                const qId = `q${index}`;
                let distractors = uniqueTr.filter(t => t !== word.tr);
                shuffleArray(distractors);
                let options = shuffleArray([word.tr, ...distractors.slice(0, 3)]);
                
                html += `<div class="question" id="${qId}" style="animation-delay: ${index * 0.05}s;">
                            <p class="question-text">${index + 1}. ${word.en}</p>`;
                options.forEach(opt => {
                    // Kesme işaretlerinin JS kodunu bozmaması için eklendi:
                    const safeOpt = opt.replace(/'/g, "\\'");
                    html += `<button class="option-button" data-ans="${opt}" onclick="check('${qId}', '${safeOpt}')">${opt}</button>`;
                });
                html += `</div>`;
            });
            quizArea.innerHTML = html;
        }

        function check(qId, selected) {
            if (answeredQuestions[qId]) return;
            const qEl = document.getElementById(qId);
            const btns = qEl.querySelectorAll('.option-button');
            const qTxt = qEl.querySelector('.question-text').textContent.split('. ')[1];
            const correct = wordList.find(w => w.en === qTxt).tr;

            btns.forEach(b => {
                b.disabled = true;
                if (b.dataset.ans === correct) b.classList.add('correct');
                if (b.dataset.ans === selected && selected !== correct) b.classList.add('incorrect');
            });
            if (selected === correct) score++;
            answeredQuestions[qId] = true;
        }

        function showResults() {
            const results = document.getElementById('results');
            results.innerHTML = `<h2>TEBRİKLER!</h2><p>Puanınız: ${score} / ${wordList.length}</p><p>Başarı Oranı: %${Math.round((score/wordList.length)*100)}</p>`;
            results.style.display = 'block';
            results.scrollIntoView({behavior: "smooth"});
        }

        document.addEventListener('DOMContentLoaded', generateQuiz);
    </script>
</body>
</html>
