    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 2.5rem 1rem;
        }

        .header-container {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .header-container h1 {
            font-size: 2.4rem;
            color: #ff4757;
            margin-bottom: 0.3rem;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .header-container div {
            font-size: 0.95rem;
            color: #9e9e9e;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        nav {
            width: 100%;
            max-width: 550px;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        nav a {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #1e1e1e;
            padding: 1.1rem 1.3rem;
            border-radius: 12px;
            text-decoration: none;
            color: #ffffff;
            border: 1px solid #2c2c2c;
            transition: all 0.2s ease-in-out;
        }

        nav a:hover {
            background-color: #252525;
            border-color: #ff4757;
            transform: translateX(4px);
        }

        nav a div {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        nav a span:first-child {
            font-size: 0.8rem;
            color: #ff4757;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        nav a span:last-child {
            font-size: 1.05rem;
            color: #f1f1f1;
            font-weight: 500;
        }

        nav a > span:last-child {
            font-size: 1.2rem;
            color: #ff4757;
            font-weight: bold;
        }

        .back-link {
            margin-top: 2.5rem;
            text-decoration: none;
            color: #9e9e9e;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #ffffff;
        }
    </style>
</head>
